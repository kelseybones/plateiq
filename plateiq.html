<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PlateIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <style>
:root{--bg:#0a0b0d;--shell:#0e0f12;--card:#16181d;--card-2:#1c1f25;--border:#24272e;--border-2:#2d3038;--text:#f4f5f7;--text-2:#a8aab0;--text-3:#6b6e76;--danger:#ff4d4d;--warn:#ffb547;--accent:#c6ff3a;--accent-ink:#0a0b0d;--accent-soft:rgba(198,255,58,.14);--m-protein:#c6ff3a;--m-carbs:#5cd1ff;--m-fat:#ffb547;--f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;--r-sm:8px;--r:14px;--r-lg:20px;--r-xl:28px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-display);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.mono{font-family:var(--f-mono);font-feature-settings:"tnum" 1,"ss01" 1;letter-spacing:-.01em}
.up{text-transform:uppercase;letter-spacing:.08em}
.phone{width:390px;height:844px;background:var(--shell);border-radius:44px;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--border),0 40px 80px -20px rgba(0,0,0,.5),0 20px 40px -20px rgba(0,0,0,.4);color:var(--text);display:flex;flex-direction:column;flex:none}
.phone-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-family:var(--f-mono);font-size:13px;font-weight:600;flex-shrink:0}
.phone-status .right{display:flex;gap:6px;align-items:center}
.phone-body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.phone-body::-webkit-scrollbar{width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:16px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em;transition:transform .12s ease,opacity .2s ease;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn-primary{background:var(--accent);color:var(--accent-ink)}.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border-2)}.btn-block{width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.section-title{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:-.005em}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(180deg,transparent 0%,var(--shell) 30%);display:flex;align-items:flex-end;padding:0 12px 22px;z-index:10}
.tabbar-inner{flex:1;height:60px;background:var(--card);border:1px solid var(--border);border-radius:20px;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.tab{flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-3);position:relative;transition:color .15s ease}
.tab.active{color:var(--text)}.tab.active::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.tab-fab{width:56px;height:56px;background:var(--accent);color:var(--accent-ink);border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;margin:0 4px}
.bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.between{justify-content:space-between}.center{justify-content:center;align-items:center}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s ease both}
@keyframes scanLine{0%,100%{top:18%}50%{top:82%}}
  </style>
</head>
<body>
<div id="root"></div>
