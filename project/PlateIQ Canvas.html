<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PlateIQ — Design Canvas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { background: #0a0b0d; }
    .canvas-phone { width: 390px; height: 844px; transform: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script type="text/babel" src="food-log.jsx"></script>
  <script type="text/babel" src="macros.jsx"></script>
  <script type="text/babel" src="progress.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>

  <script type="text/babel">
    const SAMPLE_DATA = {
      consumed: 1290, calorieGoal: 2800,
      p: 118, c: 160, f: 38,
      pGoal: 180, cGoal: 320, fGoal: 90,
      meals: [
        { id: "m1", name: "Whey isolate + oats",      slot: "breakfast", time: "08:24", kcal: 410, p: 38, c: 52, f: 6 },
        { id: "m2", name: "Chicken, rice & broccoli", slot: "lunch",     time: "13:10", kcal: 612, p: 58, c: 72, f: 8 },
        { id: "m3", name: "Greek yogurt + banana",    slot: "snack",     time: "16:45", kcal: 268, p: 22, c: 36, f: 1 },
      ],
    };
    const PROFILE = { goal: "muscle", calorieGoal: 2800, pGoal: 180, cGoal: 320, fGoal: 90 };

    // Wrap in phone shell for canvas display
    const PhoneFrame = ({ children, label }) => (
      <div className="phone canvas-phone" data-screen-label={label}>
        <StatusBar/>
        {children}
      </div>
    );

    // Onboarding step renderers (no router state)
    const ObStep = ({ step, total, children }) => (
      <div className="phone-body" style={{ display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "8px 24px 0", display: "flex", alignItems: "center", gap: 16 }}>
          <div style={{ width: 36 }}/>
          <div style={{ flex: 1, display: "flex", gap: 6 }}>
            {Array.from({ length: total }).map((_, i) => (
              <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i <= step ? "var(--accent)" : "var(--border)" }}/>
            ))}
          </div>
          <div className="mono" style={{ fontSize: 11, color: "var(--text-3)", width: 36, textAlign: "right" }}>
            {String(step + 1).padStart(2, "0")}/{String(total).padStart(2, "0")}
          </div>
        </div>
        {children}
      </div>
    );

    const App = () => (
      <DesignCanvas title="PlateIQ" subtitle="High-fidelity prototype · all screens + variations">
        <DCSection id="onb" title="Onboarding · 4 steps">
          <DCArtboard id="ob1" label="01 Welcome" width={390} height={844}>
            <PhoneFrame label="01 Welcome">
              <ObStep step={0} total={4}><StepWelcome onNext={() => {}}/></ObStep>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="ob2" label="02 Goal" width={390} height={844}>
            <PhoneFrame label="02 Goal">
              <ObStep step={1} total={4}><StepGoal value="muscle" onChange={() => {}} onNext={() => {}}/></ObStep>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="ob3" label="03 Calorie goal" width={390} height={844}>
            <PhoneFrame label="03 Calorie goal">
              <ObStep step={2} total={4}>
                <StepCalories goal="muscle" calories="2800" onCalories={()=>{}} protein="180" onProtein={()=>{}} useProtein={true} onUseProtein={()=>{}} onNext={()=>{}}/>
              </ObStep>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="ob4" label="04 All set" width={390} height={844}>
            <PhoneFrame label="04 All set">
              <ObStep step={3} total={4}>
                <StepDone goal="muscle" calories="2800" protein="180" useProtein={true} onNext={()=>{}}/>
              </ObStep>
            </PhoneFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="dash" title="Dashboard · layout variations">
          <DCArtboard id="d1" label="A · Ring-first" width={390} height={844}>
            <PhoneFrame label="Dashboard A · Ring">
              <div className="phone-body">
                <Dashboard data={SAMPLE_DATA} layout="ring" onLog={()=>{}} onMeal={()=>{}}/>
              </div>
              <TabBar active="home" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="d2" label="B · Split" width={390} height={844}>
            <PhoneFrame label="Dashboard B · Split">
              <div className="phone-body">
                <Dashboard data={SAMPLE_DATA} layout="split" onLog={()=>{}} onMeal={()=>{}}/>
              </div>
              <TabBar active="home" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="d3" label="C · Stacked" width={390} height={844}>
            <PhoneFrame label="Dashboard C · Stacked">
              <div className="phone-body">
                <Dashboard data={SAMPLE_DATA} layout="stacked" onLog={()=>{}} onMeal={()=>{}}/>
              </div>
              <TabBar active="home" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="log" title="Food logging">
          <DCArtboard id="l1" label="Search & recents" width={390} height={844}>
            <PhoneFrame label="Food search">
              <FoodLog onClose={()=>{}} onAdd={()=>{}} mealSlot="lunch" setMealSlot={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="l2" label="Detail / edit" width={390} height={844}>
            <PhoneFrame label="Food detail">
              <FoodDetailWrap/>
            </PhoneFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="mac" title="Macro breakdown · chart variations">
          <DCArtboard id="mc1" label="A · Donut" width={390} height={844}>
            <PhoneFrame label="Macros A · Donut">
              <div className="phone-body">
                <MacroBreakdown data={SAMPLE_DATA} variant="donut"/>
              </div>
              <TabBar active="macros" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="mc2" label="B · Stacked bar" width={390} height={844}>
            <PhoneFrame label="Macros B · Bar">
              <div className="phone-body">
                <MacroBreakdown data={SAMPLE_DATA} variant="bar"/>
              </div>
              <TabBar active="macros" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="mc3" label="C · Radial rings" width={390} height={844}>
            <PhoneFrame label="Macros C · Radial">
              <div className="phone-body">
                <MacroBreakdown data={SAMPLE_DATA} variant="radial"/>
              </div>
              <TabBar active="macros" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="prog" title="Progress & settings">
          <DCArtboard id="p1" label="Progress tracking" width={390} height={844}>
            <PhoneFrame label="Progress">
              <div className="phone-body">
                <Progress data={SAMPLE_DATA}/>
              </div>
              <TabBar active="progress" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
          <DCArtboard id="s1" label="Settings & profile" width={390} height={844}>
            <PhoneFrame label="Settings">
              <div className="phone-body">
                <Settings data={PROFILE} onUpdate={()=>{}}/>
              </div>
              <TabBar active="profile" onChange={()=>{}} onPlus={()=>{}}/>
            </PhoneFrame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    // Helper to display the food detail directly
    const FoodDetailWrap = () => {
      const food = { id: "f1", name: "Chicken breast, grilled", brand: "Generic", serving: "100g", kcal: 165, p: 31, c: 0, f: 3.6, freq: 18 };
      return <FoodDetail food={food} mealSlot="lunch" onBack={()=>{}} onLog={()=>{}}/>;
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
